# Builds a universal Sippy.app and publishes a GitHub release when a version tag is pushed:
#   git tag v1.0.0 && git push origin v1.0.0
# Release notes come from that version's section in CHANGELOG.md (the run fails without one).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 1.0.1). Builds artifacts only; no release."
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Pick version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
          fi

      - name: Release notes from CHANGELOG.md
        run: .github/scripts/release-notes.sh "$VERSION" > release-notes.md && cat release-notes.md

      - name: Build universal app
        working-directory: native
        env:
          UNIVERSAL: "1"
        run: scripts/build.sh

      - name: Name artifacts by version
        working-directory: native/dist
        run: |
          mv Sippy.dmg "Sippy-$VERSION.dmg"
          mv Sippy.zip "Sippy-$VERSION.zip"
          shasum -a 256 "Sippy-$VERSION.dmg" "Sippy-$VERSION.zip" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Sippy-${{ env.VERSION }}
          path: |
            native/dist/Sippy-*.dmg
            native/dist/Sippy-*.zip
            native/dist/SHA256SUMS.txt

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: Sippy ${{ env.VERSION }}
          body_path: release-notes.md
          files: |
            native/dist/Sippy-*.dmg
            native/dist/Sippy-*.zip
            native/dist/SHA256SUMS.txt
