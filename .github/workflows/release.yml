# Builds a universal Sippy.app and publishes a GitHub release when a version tag is pushed:
#   git tag v1.0.0 && git push origin v1.0.0
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 1.0.1). Builds artifacts only; no release."
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Pick version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
          fi

      - name: Build universal app
        working-directory: native
        env:
          UNIVERSAL: "1"
        run: scripts/build.sh

      - name: Name artifacts by version
        working-directory: native/dist
        run: |
          mv Sippy.dmg "Sippy-$VERSION.dmg"
          mv Sippy.zip "Sippy-$VERSION.zip"
          shasum -a 256 "Sippy-$VERSION.dmg" "Sippy-$VERSION.zip" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Sippy-${{ env.VERSION }}
          path: |
            native/dist/Sippy-*.dmg
            native/dist/Sippy-*.zip
            native/dist/SHA256SUMS.txt

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: Sippy ${{ env.VERSION }}
          generate_release_notes: true
          body: |
            ## Install

            1. Download **Sippy-${{ env.VERSION }}.dmg** below and open it.
            2. Drag **Sippy** into **Applications**.
            3. Open it once. Sippy isn't notarized by Apple, so macOS will block the first launch:
               - **macOS 15 Sequoia and later:** click *Done*, then go to **System Settings → Privacy & Security**, scroll down, and click **Open Anyway** next to Sippy.
               - **macOS 13–14:** right-click Sippy in Applications → **Open** → **Open**.
               - Or in Terminal: `xattr -dr com.apple.quarantine /Applications/Sippy.app`
            4. Look for the glass icon in your menu bar. The character comes out to say hi. 💧

            Universal app (Apple silicon + Intel), macOS 13 Ventura or later.
            Make it yours with the [character guide](https://github.com/vipulchaudhary16/Sippy/blob/main/docs/character-guide.md).
          files: |
            native/dist/Sippy-*.dmg
            native/dist/Sippy-*.zip
            native/dist/SHA256SUMS.txt
